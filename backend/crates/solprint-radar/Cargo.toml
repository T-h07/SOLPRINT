[package]
name = "solprint-radar"
description = "RADAR: autonomous, evidence-backed wallet discovery and candidate registry (read-only research)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
solprint-core.workspace = true
solprint-config.workspace = true
solprint-storage.workspace = true
solprint-gateway.workspace = true
solprint-data-engine.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
rust_decimal = { workspace = true, features = ["std", "maths"] }
time = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
solprint-storage = { workspace = true, features = ["test-support"] }
proptest.workspace = true

[[bench]]
name = "radar_bench"
harness = false

[lints]
workspace = true
