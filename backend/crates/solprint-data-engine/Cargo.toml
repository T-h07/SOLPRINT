[package]
name = "solprint-data-engine"
description = "DATA ENGINE: evidence-backed ingestion, reconstruction and decoding of Solana transactions (read-only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
solprint-core.workspace = true
solprint-config.workspace = true
solprint-storage.workspace = true
solprint-gateway.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util.workspace = true
serde = { workspace = true }
serde_json.workspace = true
bs58 = { workspace = true, features = ["alloc"] }
sha2.workspace = true
rust_decimal = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
solprint-storage = { workspace = true, features = ["test-support"] }
proptest.workspace = true

[[bench]]
name = "data_engine_bench"
harness = false

[lints]
workspace = true
