[package]
name = "solprint-gateway"
description = "GATEWAY: the sole typed, budgeted and observable access layer to external Solana data providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
solprint-core.workspace = true
solprint-config.workspace = true
solprint-storage.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
moka.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
rust_decimal = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std", "macros"] }
url.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "test-util"] }
axum = { workspace = true, features = ["http1", "json", "tokio", "query"] }
solprint-storage = { workspace = true, features = ["test-support"] }
bs58 = { workspace = true, features = ["alloc"] }

[[test]]
name = "gateway_db"
required-features = []

[[bench]]
name = "gateway_bench"
harness = false

[lints]
workspace = true
