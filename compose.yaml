# SOLPRINT local development stack.
#
#   docker compose up --build -d     # full stack
#   docker compose up -d postgres    # database only (native workflow)
#
# Security posture (Phase 00 is NOT approved for public deployment):
#   * Every published port binds to 127.0.0.1 only.
#   * The backend is not published at all; the browser reaches it through the
#     frontend's same-origin reverse proxy.
#   * PostgreSQL is published on loopback for the documented native workflow.
#   * Secrets come from the root .env via variable interpolation; no env file
#     is copied into any image.

name: solprint

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: solprint_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run scripts/setup.ps1 to set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      SOLPRINT_DB_PASSWORD: ${SOLPRINT_DB_PASSWORD:?run scripts/setup.ps1 to set SOLPRINT_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U solprint_admin -d solprint -q"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging: *logging

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
      args:
        SOLPRINT_GIT_COMMIT: ${SOLPRINT_GIT_COMMIT:-}
    image: solprint-backend:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://solprint_app:${SOLPRINT_DB_PASSWORD}@postgres:5432/solprint
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      TRADING_MODE: ${TRADING_MODE:-paper}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      DEXSCREENER_BASE_URL: ${DEXSCREENER_BASE_URL:-https://api.dexscreener.com}
      SOLANA_FALLBACK_RPC_URL: ${SOLANA_FALLBACK_RPC_URL:-https://api.mainnet-beta.solana.com}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    logging: *logging

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    image: solprint-frontend:dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SOLPRINT_WEB_PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  postgres-data:
